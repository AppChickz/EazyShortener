name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eazyshortener
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: eazyshortener
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U eazyshortener -d eazyshortener"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      PORT: 3000
      APP_BASE_URL: http://127.0.0.1:3000
      APP_SECRET: ci-only-secret-change-me-32-bytes-minimum
      DATABASE_URL: postgresql://eazyshortener:ci_password@127.0.0.1:5432/eazyshortener?schema=public
      POSTGRES_USER: eazyshortener
      POSTGRES_PASSWORD: ci_password
      POSTGRES_DB: eazyshortener
      JWT_COOKIE_NAME: eazyshortener_session
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1125
      SMTP_SECURE: false
      MAIL_FROM: EazyShortener CI <no-reply@example.invalid>
      API_TOKEN_PREFIX: ez_live_
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run prisma:generate

      - name: Apply database migrations
        run: pnpm exec prisma migrate deploy

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
